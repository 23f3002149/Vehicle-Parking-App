<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Login</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      color: red;
      margin-top: 40px;
      font-size: 36px;
    }

    .login-box {
      border: 2px solid black;
      border-radius: 15px;
      width: 300px;
      margin: 60px auto;
      padding: 20px;
      box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
      color: purple;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
      padding-left: 10px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input {
      width: 90%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .btn-login {
      background-color: #66ccff;
      color: black;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-login:hover {
      background-color: #33b5e5;
    }

    .create-account {
      display: block;
      margin-top: 10px;
      color: orange;
      text-decoration: none;
      font-weight: bold;
    }

    .create-account:hover {
      text-decoration: underline;
    }
  </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Vehicle Parking</h1>

  <div class="login-box">
    <h2>User Login</h2>
    <form method="POST" action="/"><!--action means where(to which route) to send the data of the form and method is post -->
      <div class="form-group">
        <label for="email">Registered Email ID:</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password :</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button class="btn-login" type="submit">Login</button>
      <a href="/register" class="create-account">Create Account?</a>
    </form>
    <div style="color: red;"> {{error}}</div><!--error message matlab ye jab show hoga jab error aaega -->
    <div style="color: rgb(10, 218, 10);">{{success_msg}}</div>
  </div>
</body>
</html>
